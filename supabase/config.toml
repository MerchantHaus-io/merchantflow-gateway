# verify_jwt policy — see docs/EDGE_FUNCTION_AUTH_AUDIT.md for the full table.
#
# NOTE: verify_jwt = true only requires *a* valid project-signed JWT, and the
# publishable anon key is one. It stops unauthenticated scanning; it does NOT
# stop anyone who reads the anon key out of the JS bundle. Functions handling
# privileged data still need their own requireAuth/requireRole check.
#
#   true  — everything reachable only by a signed-in user or a cron caller
#   false — genuinely public endpoints (merchant intake, quote acceptance) and
#           third-party webhooks, which authenticate by signature instead

[functions.export-data]
verify_jwt = true


